org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dev signing. phone and wear MUST be signed with the same certificate for the
# Wear OS DataLayer to route messages, and a stable key across machines means
# `adb install -r` replaces the APK in place instead of forcing an uninstall
# (which would delete /data/data and the Room/DataStore files with it).
# The keystore is a throwaway dev key, committed on purpose. Never use it for
# a Play release: wire a real one via CI secrets instead.
kaloriku.dev.keystore=keystore/kaloriku-dev.jks
kaloriku.dev.keystore.password=kaloriku-dev
kaloriku.dev.key.alias=kaloriku-dev
kaloriku.dev.key.password=kaloriku-dev
